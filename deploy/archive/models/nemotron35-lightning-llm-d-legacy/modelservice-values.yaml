# llm-d ModelService — Nemotron 3.5 Lightning with DSpark speculative decoding
multinode: false

accelerator:
  type: nvidia
  dra: false
  resources:
    nvidia: nvidia.com/gpu.shared

modelArtifacts:
  uri: "hf://nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
  size: 40Gi
  authSecretName: "hf-token"
  name: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: nemotron35-lightning-llm-d
    llm-d.ai/hardware-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
    connector: nixlv2
    secure: false

decode:
  parallelism:
    tensor: 1
  create: true
  replicas: 1
  strategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: spark-01
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["spark-01"]
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: docker.io/vllm/vllm-openai:v0.27.1
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 180
        timeoutSeconds: 10
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        periodSeconds: 15
        failureThreshold: 3
        timeoutSeconds: 10
      args:
        - --served-model-name
        - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
        - --max-model-len
        - "65536"
        - --gpu-memory-utilization
        - "0.80"
        - --moe-backend
        - marlin
        - --kv-cache-dtype
        - fp8
        - --mamba-backend
        - flashinfer
        - --mamba-cache-mode
        - align
        - --enable-prefix-caching
        - --speculative_config.model
        - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
        - --speculative_config.num_speculative_tokens
        - "3"
        - --reasoning-parser
        - nemotron_v3
        - --tool-call-parser
        - qwen3_coder
        - --enable-auto-tool-choice
        - --safetensors-load-strategy
        - eager
        - --trust-remote-code
      env:
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_CACHE
          value: /model-cache/hub
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: FLASHINFER_DISABLE_VERSION_CHECK
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
      resources:
        requests:
          cpu: "8"
          memory: 24Gi
          nvidia.com/gpu.shared: "1"
        limits:
          cpu: "16"
          memory: 112Gi
          nvidia.com/gpu.shared: "1"
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /home/nvidia/.cache/huggingface
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
