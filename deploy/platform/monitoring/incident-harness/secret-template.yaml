# Copy this to secret.yaml, fill in real values, then:
#   kubectl apply -f deploy/platform/monitoring/incident-harness/secret.yaml
#
# DO NOT commit secret.yaml — it contains live credentials.
# This template is safe to commit.
apiVersion: v1
kind: Secret
metadata:
  name: incident-harness-secrets
  namespace: monitoring
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/REPLACE/ME/WITH_REAL_WEBHOOK"
  PAGERDUTY_ROUTING_KEY: "REPLACE_WITH_PAGERDUTY_EVENTS_API_V2_INTEGRATION_KEY"
