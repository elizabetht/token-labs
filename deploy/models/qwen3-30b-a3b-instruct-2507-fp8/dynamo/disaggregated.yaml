apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-30b-control-dynamo-disagg
  labels:
    app.kubernetes.io/name: vllm-disagg-gb10-dspark
    app.kubernetes.io/part-of: dynamo
    token-labs/scenario: qwen3-30b-control
  namespace: token-labs
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/hostname: spark-02
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --trust-remote-code
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_HTTP_BODY_LIMIT_MB
                  value: '200'
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: NCCL_IB_DISABLE
                  value: "1"
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 60
                failureThreshold: 60
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
          volumes:
            - name: shared-model-cache
              hostPath:
                path: /home/nvidia/.cache/huggingface
                type: Directory
    - name: VllmPrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          volumes:
            - name: shared-model-cache
              hostPath:
                path: /home/nvidia/.cache/huggingface
                type: Directory
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --model
                - Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
                - --served-model-name
                - Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
                - --trust-remote-code
                - --tensor-parallel-size
                - "1"
                - --max-model-len
                - "32768"
                - --max-num-seqs
                - "1"
                - --gpu-memory-utilization
                - "0.40"
                - --enable-prefix-caching
                - --kv-transfer-config
                - '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
                - --disaggregation-mode
                - prefill
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: VLLM_OMNI_USE_QUACK_FP8
                  value: "0"
                - name: VLLM_WORKER_MULTIPROC_METHOD
                  value: "spawn"
                - name: NIXL_LOG_LEVEL
                  value: INFO
                - name: PYTHONHASHSEED
                  value: '0'
                - name: NCCL_IB_DISABLE
                  value: "1"
              resources:
                requests:
                  cpu: "4"
                  memory: 32Gi
                  nvidia.com/gpu.shared: "1"
                limits:
                  cpu: "8"
                  memory: 56Gi
                  nvidia.com/gpu.shared: "1"
              securityContext:
                runAsUser: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
          nodeSelector:
            kubernetes.io/hostname: spark-02
    - name: VllmDecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          volumes:
            - name: shared-model-cache
              hostPath:
                path: /home/nvidia/.cache/huggingface
                type: Directory
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --model
                - Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
                - --served-model-name
                - Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
                - --trust-remote-code
                - --tensor-parallel-size
                - "1"
                - --max-model-len
                - "32768"
                - --max-num-seqs
                - "1"
                - --gpu-memory-utilization
                - "0.40"
                - --enable-prefix-caching
                - --kv-transfer-config
                - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
                - --disaggregation-mode
                - decode
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: VLLM_OMNI_USE_QUACK_FP8
                  value: "0"
                - name: VLLM_WORKER_MULTIPROC_METHOD
                  value: "spawn"
                - name: NIXL_LOG_LEVEL
                  value: INFO
                - name: PYTHONHASHSEED
                  value: '0'
                - name: NCCL_IB_DISABLE
                  value: "1"
              resources:
                requests:
                  cpu: "4"
                  memory: 32Gi
                  nvidia.com/gpu.shared: "1"
                limits:
                  cpu: "8"
                  memory: 56Gi
                  nvidia.com/gpu.shared: "1"
              securityContext:
                runAsUser: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
          nodeSelector:
            kubernetes.io/hostname: spark-02
