# llm-d ModelService — Nemotron 3.5 Lightning with DSpark speculative decoding
multinode: false
accelerator:
  type: nvidia
  dra: false
  resources:
    nvidia: nvidia.com/gpu.shared
modelArtifacts:
  uri: "hf://Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
  size: 40Gi
  authSecretName: "hf-token"
  name: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: qwen3-30b-control-llm-d
    llm-d.ai/hardware-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    token-labs/scenario: qwen3-30b-control
routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
    connector: nixlv2
    secure: false
decode:
  parallelism:
    tensor: 1
  create: true
  replicas: 1
  strategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: spark-01
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["spark-01"]
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.1
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 180
        timeoutSeconds: 10
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        periodSeconds: 15
        failureThreshold: 3
        timeoutSeconds: 10
      args:
        - --served-model-name
        - Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
        - --max-model-len
        - "32768"
        - --max-num-seqs
        - "1"
        - --gpu-memory-utilization
        - "0.40"
        - --enable-prefix-caching
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        - --trust-remote-code
      env:
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_CACHE
          value: /model-cache/hub
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: FLASHINFER_DISABLE_VERSION_CHECK
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu.shared: "1"
        limits:
          cpu: "8"
          memory: 56Gi
          nvidia.com/gpu.shared: "1"
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /home/nvidia/.cache/huggingface
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
