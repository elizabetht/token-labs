# Nemotron-3.5-Lightning-30B-A3B-NVFP4 — vLLM on spark-01
#
# Model notes (from config.json):
#   - architectures: NemotronHForCausalLM, model_type: nemotron_h
#   - Hybrid Mamba-2 + MoE: 52 layers, 128 routed experts, top-6, hidden 2688
#   - quantization_config is compressed-tensors MIXED_PRECISION (NVFP4 experts,
#     FP8 mamba projections, FP8 KV cache). Do NOT pass --quantization; vLLM
#     auto-detects from config.json. Forcing it breaks the mixed-precision path.
#   - max_position_embeddings is 1048576 (1M). We cap at 65536 — the full 1M
#     context would demand far more KV than a single GB10 can hold.
#
# Platform notes:
#   - DGX Spark GB10 is aarch64 / SM 12.1. vllm-openai:v0.27.1 is a multi-arch
#     manifest (amd64+arm64), so the tag resolves correctly on these nodes.
#   - 119 GiB *unified* CPU+GPU memory. gpu-memory-utilization 0.55 (~65 GiB)
#     leaves host headroom; going higher starves the kubelet and produces the
#     unkillable-container failure mode seen with the previous tenant.
#   - enforce-eager: skips CUDA graph capture. Costs some throughput but avoids
#     the memory-profiling starvation seen on ARM64 during first boot.
#   - hostPath HF cache (not a Longhorn PVC) deliberately: RWO PVCs have caused
#     rollout deadlocks here before, and spark-01 has 744 GiB free on /.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron35-lightning-vllm
  namespace: token-labs
  labels:
    app: nemotron35-lightning-vllm
    llm-d.ai/model: nemotron35-lightning-vllm
    token-labs/engine: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nemotron35-lightning-vllm
  template:
    metadata:
      labels:
        app: nemotron35-lightning-vllm
        llm-d.ai/model: nemotron35-lightning-vllm
        llm-d.ai/inference-serving: "true"
        token-labs/engine: vllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: spark-01
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: hf-cache
          hostPath:
            path: /home/nvidia/.cache/huggingface
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.27.1
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
            - --served-model-name
            - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
            - --port
            - "8000"
            - --max-model-len
            - "65536"
            - --gpu-memory-utilization
            - "0.55"
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --max-num-batched-tokens
            - "8192"
            - --enforce-eager
            - --trust-remote-code
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /hf-cache
            - name: HF_HUB_CACHE
              value: /hf-cache/hub
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
            - name: FLASHINFER_DISABLE_VERSION_CHECK
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          # 21.6 GiB of weights over 52 shards on first boot; allow ~90 min
          # before the kubelet gives up (180 * 30s).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 180
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: shm
              mountPath: /dev/shm
