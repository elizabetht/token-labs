# llm-d ModelService — Nemotron 3.5 Lightning with DSpark speculative decoding
multinode: false
accelerator:
  type: nvidia
  dra: false
  resources:
    nvidia: nvidia.com/gpu.shared
modelArtifacts:
  uri: "hf://nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
  size: 40Gi
  authSecretName: "hf-token"
  name: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: nemotron35-lightning-llm-d
    llm-d.ai/hardware-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    token-labs/scenario: nemotron35-dspark
routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.7.1
    connector: nixlv2
    secure: false
decode:
  parallelism:
    tensor: 1
  create: true
  replicas: 1
  strategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: spark-01
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["spark-01"]
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1002
        allowPrivilegeEscalation: false
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 180
        timeoutSeconds: 10
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        periodSeconds: 15
        failureThreshold: 3
        timeoutSeconds: 10
      args:
        - --served-model-name
        - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
        - --max-model-len
        - "32768"
        - --max-num-seqs
        - "1"
        - --gpu-memory-utilization
        - "0.40"
        - --quantization
        - modelopt_fp4
        - --enable-prefix-caching
        - --mamba-cache-mode
        - align
        - --no-disable-hybrid-kv-cache-manager
        - --mamba-backend
        - flashinfer
        - --mamba-ssm-cache-dtype
        - float16
        - --speculative-config
        - '{"method":"dspark","model":"nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark","num_speculative_tokens":1,"attention_backend":"TRITON_ATTN"}'
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        - --reasoning-parser
        - nemotron_v3
        - --trust-remote-code
      env:
        # The image default HOME belongs to its built-in user, while this
        # workload runs as UID 1002 to share the node-local model cache.
        # Keep generated JIT/runtime artifacts in pod-local writable storage.
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: FLASHINFER_WORKSPACE_DIR
          value: /tmp/.cache/flashinfer
        - name: TRITON_CACHE_DIR
          value: /tmp/.triton-cache
        - name: VLLM_CACHE_ROOT
          value: /tmp/vllm-cache
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torchinductor-cache
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_CACHE
          value: /model-cache/hub
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: FLASHINFER_DISABLE_VERSION_CHECK
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: VLLM_DISABLED_KERNELS
          value: FlashInferFP8ScaledMMLinearKernel
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu.shared: "1"
        limits:
          cpu: "8"
          memory: 56Gi
          nvidia.com/gpu.shared: "1"
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /home/nvidia/.cache/huggingface
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
